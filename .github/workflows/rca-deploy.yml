name: RCA Deploy (CD)

# Manual only — never runs on push. Deploys to the `eks_samv` EKS cluster's `rca` namespace,
# mirroring cnapp_rca/rca_ui/k8s/deploy_k8s.sh but sourcing all credentials from GitHub
# Secrets instead of a local .env/.env.k8s file, so this doesn't depend on any one machine
# having those files.
#
# Deliberately does NOT build or push an image — that's rca-ci.yml's job now (its
# "build-and-push" job, on every push where the Docker-relevant files actually changed).
# This workflow just verifies the requested tag already exists in ECR before deploying it,
# so a bad/late click can't silently deploy nothing — see "Verify image exists in ECR" below.
#
# AWS auth: a dedicated IAM user (gh-actions-rca-deploy), not the account admin — scoped to
# eks:DescribeCluster on this one cluster, namespace-scoped EKS access entries
# (AmazonEKSEditPolicy + AmazonEKSSecretAdminPolicy, both scoped to the `rca` namespace only)
# for in-cluster permissions, and ecr:DescribeImages on the rca-dashboard repo (read-only —
# this workflow never pushes; that's now rca-ci.yml, using the same IAM user's separate push
# grant). It deliberately cannot create the `rca` namespace itself (Namespace is a
# cluster-scoped resource, outside what a namespace-scoped access policy grants) — the
# namespace must already exist. It does today; if a full teardown (rca_tear_down.sh with no
# flags, or --full) ever removes it again, recreate it once with your own (broader) kubectl
# access before re-running this workflow:
#   kubectl apply -f cnapp_rca/rca_ui/k8s/namespace.yaml
#
# One narrow addition on top of the above: this user also needs `get`/`list` on `nodes`
# (cluster-scoped, so outside any namespace-scoped grant too) purely to read a node's public
# address for the "Status and access URL" step below. Confirmed live that omitting this
# fails hard — `Error from server (Forbidden): nodes is forbidden: User "...gh-actions-
# rca-deploy" cannot list resource "nodes" ... at the cluster scope` — not the transient
# flakiness an earlier version of this comment assumed. Rather than broadening to AWS's full
# (read-everywhere) AmazonEKSViewPolicy, this is granted as a minimal native Kubernetes
# ClusterRole + ClusterRoleBinding (get/list on nodes only, nothing else) — see
# cnapp_rca/rca_ui/k8s/ci-node-reader-rbac.yaml, applied once, out-of-band (not part of any
# `kubectl apply -k`, since it's cluster-scoped RBAC, not a namespaced app resource).
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (must already exist in ECR — rca-ci.yml builds it on push)'
        required: false
        default: 'latest'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cnapp_rca/rca_ui
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify image exists in ECR
        env:
          IMAGE: ${{ vars.ECR_REGISTRY }}/rca-dashboard:${{ github.event.inputs.image_tag }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -eu
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          # This workflow no longer builds anything — rca-ci.yml does, on push, whenever the
          # Docker-relevant files actually change. If this fails after all retries, either
          # that hasn't run yet for this tag (push a change, or check the Actions tab for a
          # running/failed build-and-push job), image_tag was mistyped, or — confirmed live
          # once, the hard way — the IAM user is missing ecr:DescribeImages: an earlier
          # version of this step redirected the AWS CLI's stderr to /dev/null, so a genuine
          # AccessDeniedException was indistinguishable from a real "not found" in the log.
          # stderr is now captured and printed on every failed attempt instead.
          FOUND=false
          for attempt in 1 2 3 4 5; do
            if ERR="$(aws ecr describe-images --repository-name rca-dashboard --region "$AWS_REGION" \
                 --image-ids imageTag="${{ github.event.inputs.image_tag }}" 2>&1 >/dev/null)"; then
              FOUND=true
              break
            fi
            echo "Attempt $attempt: $ERR"
            sleep 5
          done
          if [ "$FOUND" != "true" ]; then
            echo "::error::$IMAGE — see the AWS CLI error(s) logged above (last: $ERR)." >&2
            exit 1
          fi
          echo "$IMAGE exists — proceeding."

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Update kubeconfig
        env:
          EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"

      - name: Verify namespace exists
        run: |
          if ! kubectl get namespace rca >/dev/null 2>&1; then
            echo "::error::Namespace 'rca' does not exist and this workflow's IAM user cannot create it (namespace-scoped access only). Create it once with broader kubectl access: kubectl apply -f cnapp_rca/rca_ui/k8s/namespace.yaml" >&2
            exit 1
          fi

      - name: Sync FortiCNAPP credentials Secret
        env:
          # Passed via env:, not interpolated directly into the script body — GitHub's own
          # guidance: a secret substituted straight into `run:` text becomes part of the
          # shell command line before execution, so a value containing shell metacharacters
          # could break the script (or worse). Referencing $VAR keeps it a plain argument.
          LW_ACCOUNT: ${{ secrets.LW_ACCOUNT }}
          LW_KEY_ID: ${{ secrets.LW_KEY_ID }}
          LW_SECRET: ${{ secrets.LW_SECRET }}
          LW_SUBACCOUNT: ${{ secrets.LW_SUBACCOUNT }}
        run: |
          set -eu
          ARGS="--from-literal=LW_ACCOUNT=$LW_ACCOUNT --from-literal=LW_KEY_ID=$LW_KEY_ID --from-literal=LW_SECRET=$LW_SECRET"
          if [ -n "$LW_SUBACCOUNT" ]; then
            ARGS="$ARGS --from-literal=LW_SUBACCOUNT=$LW_SUBACCOUNT"
          fi
          # shellcheck disable=SC2086
          kubectl create secret generic rca-credentials -n rca $ARGS \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply manifests
        run: |
          set -eu
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          sed "s#REPLACE_ME/rca-dashboard:latest#$IMAGE#" k8s/deployment.yaml > "$TMP/deployment.yaml"
          cp k8s/pvc.yaml k8s/service.yaml k8s/kustomization.yaml "$TMP/"
          # namespace.yaml deliberately excluded — see the "Verify namespace exists" step and
          # this file's header comment on why this workflow's IAM user can't apply it.
          sed -i '/- namespace.yaml/d' "$TMP/kustomization.yaml"
          kubectl apply -k "$TMP"

      - name: Wait for rollout
        run: kubectl rollout status deployment/rca -n rca --timeout=180s

      - name: Status and access URL
        run: |
          kubectl get pods -n rca

          # Requires the ClusterRole/ClusterRoleBinding grant described in this file's header
          # comment (get/list on nodes) — without it this fails hard with a Forbidden error,
          # confirmed live. The retry loop below is defense-in-depth for genuine transient
          # API-server hiccups, not a workaround for that permission gap.
          NODE_ADDR=""
          for _ in 1 2 3 4 5; do
            NODE_ADDR="$(kubectl get nodes -o jsonpath='{range .items[*]}{range .status.addresses[?(@.type=="ExternalDNS")]}{.address}{"\n"}{end}{end}' 2>/dev/null | head -1)"
            [ -n "$NODE_ADDR" ] && break
            NODE_ADDR="$(kubectl get nodes -o jsonpath='{range .items[*]}{range .status.addresses[?(@.type=="ExternalIP")]}{.address}{"\n"}{end}{end}' 2>/dev/null | head -1)"
            [ -n "$NODE_ADDR" ] && break
            sleep 3
          done

          if [ -n "$NODE_ADDR" ]; then
            echo "Reachable at https://$NODE_ADDR:30443 (self-signed cert — accept the browser warning)."
          else
            echo "No external node address found after 5 attempts — node IPs may be private-only on this cluster, or kubectl is having trouble reaching the API server. Check manually: kubectl get nodes -o wide"
          fi
