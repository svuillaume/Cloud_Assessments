name: RCA CI

on:
  push:
    branches: ['**']
    paths:
      - 'cnapp_rca/rca_ui/**'
      - '.github/workflows/rca-ci.yml'
  pull_request:
    paths:
      - 'cnapp_rca/rca_ui/**'
      - '.github/workflows/rca-ci.yml'

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cnapp_rca/rca_ui
    steps:
      - uses: actions/checkout@v4

      - name: Syntax-check server.js
        run: node --check server.js

      - name: Shellcheck deploy/teardown scripts
        uses: ludeeus/action-shellcheck@2.0.0
        env:
          # SC1091: `. ./.env.k8s` — an optional, gitignored local file that legitimately
          # doesn't exist in a fresh checkout; the script already guards it with [ -f ... ].
          SHELLCHECK_OPTS: -e SC1091
        with:
          scandir: cnapp_rca/rca_ui/k8s

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Validate Kubernetes manifests build (kustomize)
        run: |
          set -eu
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          sed "s#REPLACE_ME/rca-dashboard:latest#ci-placeholder/rca-dashboard:latest#" \
            k8s/deployment.yaml > "$TMP/deployment.yaml"
          cp k8s/namespace.yaml k8s/pvc.yaml k8s/service.yaml k8s/kustomization.yaml "$TMP/"
          kubectl kustomize "$TMP" > /dev/null
          echo "kustomize build OK"

  build-and-push:
    needs: checks
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cnapp_rca/rca_ui
    steps:
      - uses: actions/checkout@v4
        with:
          # Need the previous commit locally too, to diff against below — the default
          # fetch-depth of 1 only gets this push's tip.
          fetch-depth: 2

      - name: Check if the image needs rebuilding
        id: changes
        run: |
          set -eu
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "No previous commit to diff against (first push on a new branch) — building."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            CHANGED="$(git diff --name-only "$BEFORE" "${{ github.sha }}" -- Dockerfile server.js roi-calculator.html entrypoint.sh)"
            if [ -n "$CHANGED" ]; then
              echo "Image-relevant files changed in this push:"
              echo "$CHANGED"
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "No image-relevant files changed in this push — skipping build and push."
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Configure AWS credentials
        if: steps.changes.outputs.changed == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        if: steps.changes.outputs.changed == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        if: steps.changes.outputs.changed == 'true'
        env:
          IMAGE: ${{ vars.ECR_REGISTRY }}/rca-dashboard
        run: |
          set -eu
          # GitHub-hosted ubuntu-latest runners are amd64 already (matches the EKS nodes'
          # arch, verified via `kubectl get nodes -o jsonpath=...nodeInfo.architecture`), so
          # this doesn't hit the arm64-Mac-building-for-amd64-nodes problem deploy_k8s.sh
          # documents — --platform is still passed explicitly rather than relied on
          # implicitly, so this stays correct even if the runner arch ever changes.
          docker build --platform linux/amd64 -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
