# Template only — replace every REPLACE_ME value before applying, or don't apply this file
# at all and instead generate the Secret directly from your existing .env:
#
#   kubectl create secret generic rca-credentials -n rca --from-env-file=.env \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# (that pulls in whatever's actually in .env, so you don't hand-edit two copies of the
# same credentials — the manifest below is only here so the shape of the Secret is
# checked into the repo for reference.)
#
# LW_ACCOUNT/LW_KEY_ID/LW_SECRET/LW_SUBACCOUNT map 1:1 to rca_ui/.env.example. LW_SUBACCOUNT
# is only needed for org/sub-account tenants — delete the key entirely rather than leaving
# it blank if you don't need it (an empty string is a different thing from unset).
apiVersion: v1
kind: Secret
metadata:
  name: rca-credentials
  namespace: rca
type: Opaque
stringData:
  LW_ACCOUNT: REPLACE_ME.lacework.net
  LW_KEY_ID: REPLACE_ME
  LW_SECRET: REPLACE_ME
  LW_SUBACCOUNT: REPLACE_ME
